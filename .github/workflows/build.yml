name: Build and test
on:
  push:
    branches: [main]
    paths-ignore: ['site/**', 'README.md', '.github/workflows/pages.yml']
  pull_request:
    paths-ignore: ['site/**', 'README.md', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-latest
    env:
      SOFA_ALLOW_ADHOC: '1'
      SOFA_SIGN_IDENTITY: '-'
      SOFA_DEVELOPMENT_ARTIFACT: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Swift, browser and signing tests
        run: ./scripts/test.sh
      - name: Build development app
        run: ./build.sh
      - name: Verify and package development artifact
        run: |
          ./scripts/verify-signing.sh --mode development --app 'build/Sofa Remote.app'
          lipo -archs 'build/Sofa Remote.app/Contents/MacOS/SofaRemote'
          cmp LICENSE 'build/Sofa Remote.app/Contents/Resources/LICENSE'
          cmp NOTICE 'build/Sofa Remote.app/Contents/Resources/NOTICE'
          test -s 'build/Sofa Remote.app/Contents/Resources/AppIcon.icns'
          for size in 180 192 512; do
            test -s "build/Sofa Remote.app/Contents/Resources/icon-$size.png"
          done
          ./scripts/package-release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Sofa-Remote-development-not-for-distribution
          if-no-files-found: error
          path: |
            build/development/Sofa-Remote-development.zip
            build/development/Sofa-Remote-development.dmg
            build/development/SHA256SUMS
