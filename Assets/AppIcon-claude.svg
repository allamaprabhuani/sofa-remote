<?xml version="1.0" encoding="UTF-8"?>
<!-- Draft Sofa Remote icon (Claude variant). Editable. No text, no rasters. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="Sofa Remote draft icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a2550"/>
      <stop offset="1" stop-color="#0b1026"/>
    </linearGradient>
    <linearGradient id="sofa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f8dff"/>
      <stop offset="1" stop-color="#355bd6"/>
    </linearGradient>
    <linearGradient id="cushion" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8aa6ff"/>
      <stop offset="1" stop-color="#4a6eea"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#2b3a7c" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0b1026" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Rounded square background. iOS clips to a squircle; this stays clear at small sizes. -->
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#bg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="224" ry="224" fill="url(#glow)"/>

  <!-- Sofa: simple two-cushion silhouette, centred, geometry readable down to 32 px. -->
  <g transform="translate(132 300)">
    <!-- Back rest -->
    <rect x="0" y="60" width="760" height="220" rx="60" ry="60" fill="url(#sofa)"/>
    <!-- Arms -->
    <rect x="0" y="200" width="110" height="240" rx="48" ry="48" fill="url(#sofa)"/>
    <rect x="650" y="200" width="110" height="240" rx="48" ry="48" fill="url(#sofa)"/>
    <!-- Seat base -->
    <rect x="40" y="300" width="680" height="150" rx="40" ry="40" fill="url(#sofa)"/>
    <!-- Cushions -->
    <rect x="130" y="230" width="240" height="170" rx="34" ry="34" fill="url(#cushion)"/>
    <rect x="390" y="230" width="240" height="170" rx="34" ry="34" fill="url(#cushion)"/>
    <!-- Legs -->
    <rect x="60" y="440" width="40" height="60" rx="12" fill="#0b1026" opacity="0.55"/>
    <rect x="660" y="440" width="40" height="60" rx="12" fill="#0b1026" opacity="0.55"/>
  </g>

  <!-- Mac arrow pointer, offset bottom-right, white with subtle shadow. -->
  <g transform="translate(612 612) rotate(-18)">
    <path d="M0 0 L0 220 L58 170 L100 262 L138 244 L96 152 L164 148 Z"
          fill="#000" opacity="0.35" transform="translate(10 14)"/>
    <path d="M0 0 L0 220 L58 170 L100 262 L138 244 L96 152 L164 148 Z"
          fill="#ffffff" stroke="#0b1026" stroke-width="10" stroke-linejoin="round"/>
  </g>
</svg>
